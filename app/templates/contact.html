{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="mb-4">Contact Us</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div class="mb-3">
            <label>Name</label>
            <input
                type="text"
                class="form-control"
                name="name"
                required>
        </div>

        <div class="mb-3">
            <label>Email</label>
            <input
                type="email"
                class="form-control"
                name="email"
                required>
        </div>

        <div class="mb-3">
            <label>Message</label>
            <textarea
                class="form-control"
                name="message"
                rows="5"
                required></textarea>
        </div>

        <button class="btn btn-primary">
            Submit
        </button>

    </form>

</div>

{% endblock %}
